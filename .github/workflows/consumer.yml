name: Consumer Build

on:
  push:
    branches:
      - main
      - dev
  pull_request:
    branches:
      - main
      - dev

jobs:
  consumer:
    name: Basic example (${{ matrix.os }})
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    concurrency:
      group: consumer-${{ matrix.os }}-${{ github.head_ref || github.ref }}
      cancel-in-progress: true

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      # Build the basic example against this checkout instead of the remote repository,
      # with strict consumer warning flags and the Launcher module on
      - name: Configure
        run: cmake -S examples/basic -B build -DCMAKE_BUILD_TYPE=Release -DFETCHCONTENT_SOURCE_DIR_LICHENS_CPP="${{ github.workspace }}" -DEXAMPLE_BASIC_STRICT_WARNINGS=ON -DBUILD_LICHENS_CPP_LAUNCHER=ON

      - name: Build
        run: cmake --build build --config Release

      - name: Run (Linux)
        if: runner.os != 'Windows'
        run: ./build/ExampleBasic --message "Hello from CI"

      - name: Run (Windows)
        if: runner.os == 'Windows'
        run: ./build/Release/ExampleBasic.exe --message "Hello from CI"
